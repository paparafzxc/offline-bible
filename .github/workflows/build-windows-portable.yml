name: Build G-word Portable for Windows
on:
  workflow_dispatch:
  push:
    branches:
      - feature/electron-portable
    paths:
      - 'index.html'
      - 'data/**'
      - 'electron/**'
      - 'scripts/check-desktop.cjs'
      - 'package.json'
      - '.github/workflows/build-windows-portable.yml'
permissions:
  contents: read
jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build portable executable
        run: npm run dist:portable
      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: G-word-Portable-Windows-x64
          path: release/G-word-Portable.exe
          if-no-files-found: error
          retention-days: 30
