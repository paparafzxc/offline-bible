<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4ef"><title>Stillword — Offline Bible</title>
<style>
:root{--bg:#f6f4ef;--panel:#fffefa;--soft:#eeece5;--text:#292d27;--muted:#85877f;--line:#e5e2da;--accent:#687b61;--accentsoft:#e6ece2;--serif:Georgia,serif;--sans:system-ui,sans-serif}
[data-theme=dark]{--bg:#171a18;--panel:#202522;--soft:#2b302c;--text:#edf0e9;--muted:#a0a69e;--line:#394039;--accent:#a7bd9d;--accentsoft:#303c31;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px var(--sans)}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:var(--panel);border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:25px}.brand{font:24px var(--serif);padding:0 10px}.brand small{display:block;font:10px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--muted)}.navlabel{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:0 10px;margin:0 0 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:none;text-align:left;padding:11px;border-radius:9px;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--accentsoft);color:var(--text)}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;line-height:1.7}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,52px)}.content{max-width:1100px;margin:auto;padding:38px clamp(16px,4vw,52px) 70px}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:700}.welcome{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.welcome h1,.pageTitle{font:42px/1.1 var(--serif);letter-spacing:-1px;margin:9px 0}.muted,.date{color:var(--muted)}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}.feature{background:var(--accentsoft);border:0;min-height:240px;display:flex;flex-direction:column;justify-content:space-between}.quote{font:26px/1.5 var(--serif);margin:17px 0}.btn,.ghost,.icon{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:9px 12px}.btn{background:var(--accent);border-color:var(--accent);color:white}.icon{width:38px;height:38px;padding:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.reader{max-width:780px;margin:auto}.reader h1{font:38px var(--serif);margin:14px 0 5px}.readerbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.readerbar select,.searchbox input{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}.verse{display:flex;gap:13px;padding:10px;border-radius:8px;font:19px/1.8 var(--serif)}.verse:hover{background:var(--soft)}.vnum{font:11px var(--sans);color:var(--muted);padding-top:7px}.vtext{flex:1}.tools{display:none;gap:4px}.verse:hover .tools{display:flex}.tools button{border:1px solid var(--line);background:var(--panel);border-radius:5px}.mark.gold{background:#f0e5c8}.mark.green{background:#dfe9d9}.mark.blue{background:#dce8f2}.mark.pink{background:#f1dfe4}[data-theme=dark] .mark{background:#45412f}[data-theme=dark] .mark.green{background:#344536}[data-theme=dark] .mark.blue{background:#303f4b}[data-theme=dark] .mark.pink{background:#4b343c}.searchbox{display:flex;gap:8px;margin:20px 0}.searchbox input{flex:1;min-width:0}.result,.item{padding:14px;border:1px solid var(--line);border-radius:10px;margin:8px 0}.result{cursor:pointer}.result p{font:17px/1.5 var(--serif)}.result strong{color:var(--accent)}.item{display:flex;justify-content:space-between;gap:10px}.item small{display:block;color:var(--muted);margin-top:5px}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.modalback{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px}.modal{background:var(--panel);padding:22px;border-radius:15px;width:min(500px,100%)}textarea{width:100%;min-height:120px;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2;flex-direction:row;align-items:center;justify-content:space-between;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:19px}.nav{display:flex}.nav button{font-size:0;padding:9px}.nav button:after{content:attr(data-short);font-size:12px}.navlabel,.sidefoot{display:none}.grid{grid-template-columns:1fr}.content{padding-top:24px}.welcome{display:block}.welcome h1{font-size:34px}}@media(max-width:480px){.top{height:54px}.content{padding-left:14px;padding-right:14px}.quote{font-size:22px}.verse{font-size:17px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">stillword<small>the quiet place</small></div><div style="flex:1"><div class="navlabel">Library</div><nav class="nav"><button class="active" data-page="home" data-short="⌂">⌂　Home</button><button data-page="read" data-short="▤">▤　Read</button><button data-page="search" data-short="⌕">⌕　Search</button></nav><div class="navlabel" style="margin-top:20px">My study</div><nav class="nav"><button data-page="bookmarks" data-short="♡">♡　Bookmarks</button><button data-page="highlights" data-short="✎">✎　Highlights</button><button data-page="notes" data-short="▧">▧　Notes</button><button data-page="plans" data-short="◷">◷　Plans</button><button data-page="settings" data-short="⚙">⚙　Settings</button></nav></div><div class="sidefoot">A little space for the Word.<br><span id="status">Offline library</span></div></aside><main class="main"><header class="top"><span id="crumb" class="muted">Your reading space</span><div class="row"><span class="muted" id="saved">Saved on this device</span><button class="icon" id="theme">☾</button></div></header><section class="content" id="view"></section></main></div><div id="modal"></div><script src="data/bible-data.js"></script><script>
(()=>{'use strict';
const DATA=window.BIBLE_DATA,STORE='stillword.offline.v1', $=s=>document.querySelector(s);
const fresh=()=>({bookmarks:[],highlights:{},notes:{},theme:'light',font:19,plans:{},lastBook:'Gen',lastChapter:1,lastTranslation:'WEB'});
let db;try{db={...fresh(),...JSON.parse(localStorage.getItem(STORE)||'{}')}}catch{db=fresh()}
let page='home',book='Gen',chapter=1,tr='WEB',font=db.font||19,query='';
const books=DATA.books,versions=DATA.translations;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bookName=id=>books.find(x=>x.osis===id)?.name||id;
const verses=(b=book,c=chapter,t=tr)=>versions[t]?.chapters?.[b+'.'+c]||{};
const ref=(b,c,v)=>b+'.'+c+'.'+v;
const label=r=>{let [b,c,v]=r.split('.');return bookName(b)+' '+c+':'+v};
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));$('#saved').textContent='Saved on this device'}catch{$('#saved').textContent='Storage full — export backup'}}
function theme(t){db.theme=t;document.documentElement.dataset.theme=t;$('#theme').textContent=t==='dark'?'☀':'☾';save()}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function select(items,val){return items.map(x=>'<option value="'+esc(x.value)+'" '+(x.value===val?'selected':'')+'>'+esc(x.label)+'</option>').join('')}
function controls(){return '<div class="readerbar"><select id="book">'+select(books.map(x=>({value:x.osis,label:x.name})),book)+'</select><select id="chapter">'+select(Array.from({length:books.find(x=>x.osis===book).chapters},(_,i)=>({value:i+1,label:'Chapter '+(i+1)})),chapter)+'</select><select id="version">'+select(Object.keys(versions).map(k=>({value:k,label:versions[k].name})),tr)+'</select><button class="icon" id="smaller">A−</button><button class="icon" id="bigger">A+</button></div>'}
function openModal(html){$('#modal').innerHTML='<div class="modalback" id="back"><div class="modal">'+html+'</div></div>';$('#back').onclick=e=>{if(e.target.id==='back')$('#modal').innerHTML=''}}
function verseTools(r){return '<span class="tools"><button data-act="bookmark" data-ref="'+r+'">♡</button><button data-act="highlight" data-ref="'+r+'">✎</button><button data-act="note" data-ref="'+r+'">▧</button></span>'}
function renderVerses(){let v=verses(),ks=Object.keys(v).sort((a,b)=>+a-+b);return ks.length?ks.map(n=>{let r=ref(book,chapter,n),h=db.highlights[r]||'';return '<div class="verse '+(h?'mark '+h:'')+'" data-ref="'+r+'"><span class="vnum">'+n+'</span><span class="vtext" style="font-size:'+font+'px">'+esc(v[n])+'</span>'+verseTools(r)+'</div>'}).join(''):'<div class="empty">This chapter is not in the starter text dataset yet. Add a complete, licensed translation dataset to read it offline.</div>'}
function home(){let v=verses('Ps',23,'WEB')['1']||'Open the Scriptures and spend a quiet moment in the Word.';return '<div class="welcome"><div><div class="eyebrow">A moment in the Word</div><h1>Welcome to your<br>quiet place.</h1><p class="muted">Slow down. Open the Word. Let truth settle in.</p></div><span class="date muted">'+new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+'</span></div><div class="grid"><div><div class="card feature"><div><div class="eyebrow">A verse to begin</div><div class="quote">“'+esc(v)+'”</div><strong class="eyebrow">PSALM 23:1 · WEB</strong></div><button class="ghost" id="daily">Read Psalm 23 →</button></div><div class="card" style="margin-top:16px"><h3>Continue reading</h3><p class="muted">'+bookName(db.lastBook)+' '+db.lastChapter+' · '+db.lastTranslation+'</p><button class="btn" id="continue">Continue →</button></div></div><div><div class="card"><h3>Your study</h3><p>♡ Bookmarks　<strong>'+db.bookmarks.length+'</strong></p><p>✎ Highlights　<strong>'+Object.keys(db.highlights).length+'</strong></p><p>▧ Notes　<strong>'+Object.keys(db.notes).length+'</strong></p></div><div class="card" style="margin-top:16px"><h3>Library</h3><p class="muted">66 books · Old and New Testament</p><button class="btn" id="openBible">Open the Bible</button></div></div></div>'}
function read(){db.lastBook=book;db.lastChapter=chapter;db.lastTranslation=tr;save();return '<div class="reader">'+controls()+'<div class="eyebrow">'+books.find(x=>x.osis===book).testament+'</div><h1>'+bookName(book)+' '+chapter+'</h1><p class="muted">'+versions[tr].name+' · '+Object.keys(verses()).length+' verses in local dataset</p>'+renderVerses()+'<div class="row" style="justify-content:space-between;margin-top:20px"><button class="ghost" id="prev">← Previous</button><span class="muted">Chapter '+chapter+' of '+books.find(x=>x.osis===book).chapters+'</span><button class="ghost" id="next">Next →</button></div></div>'}
function collection(kind){let arr=kind==='bookmarks'?db.bookmarks:kind==='highlights'?Object.keys(db.highlights):Object.keys(db.notes);if(!arr.length)return '<div class="empty">Nothing here yet. Open a passage and use its verse actions to save something.</div>';return arr.map(r=>{let [b,c,v]=r.split('.'),txt=verses(b,+c,tr)[v]||'Verse text is not in the installed sample dataset.';return '<div class="item"><div><strong>'+esc(label(r))+'</strong><small>'+esc(kind==='notes'?db.notes[r]:txt)+'</small></div><div class="row"><button class="ghost" data-open="'+r+'">Open</button><button class="ghost" data-remove="'+r+'" data-kind="'+kind+'">×</button></div></div>'}).join('')}
function searchPage(){return '<div class="eyebrow">Explore the scriptures</div><h1 class="pageTitle">Search the Word</h1><p class="muted">Search every verse in the installed local dataset.</p><div class="searchbox"><input id="q" placeholder="Search a word or phrase…" value="'+esc(query)+'"><button class="btn" id="searchBtn">Search</button></div><div id="results"></div>'}
function doSearch(){query=$('#q').value.trim().toLowerCase();let out=[];if(query)Object.entries(versions).forEach(([code,meta])=>Object.entries(meta.chapters).forEach(([ch,vs])=>Object.entries(vs).forEach(([n,txt])=>{if(txt.toLowerCase().includes(query))out.push({r:ch+'.'+n,txt,code})})));$('#results').innerHTML=out.length?'<p class="muted">'+out.length+' result(s) in installed sample dataset</p>'+out.map(x=>'<div class="result" data-open="'+x.r+'"><strong>'+esc(label(x.r))+' · '+x.code+'</strong><p>'+esc(x.txt)+'</p></div>').join(''):'<div class="empty">'+(query?'No matches in installed sample dataset.':'Enter a search term.')+'</div>';bindOpen()}
function plans(){return '<div class="eyebrow">Grow in the Word</div><h1 class="pageTitle">Reading plans</h1>'+[['7 Days in the Psalms','A week of prayer, praise and reflection.','Ps',23],['The Life of Jesus','Seven readings from the Gospels.','John',3],['Foundations of Faith','Seven passages about Christian faith.','Rom',8]].map((p,i)=>'<div class="card" style="margin:10px 0"><h3>'+p[0]+'</h3><p class="muted">'+p[1]+'</p><p class="muted">'+(db.plans[i]||0)+' readings completed</p><button class="btn" data-plan="'+i+'">Continue plan</button></div>').join('')}
function settings(){return '<div class="eyebrow">Your application</div><h1 class="pageTitle">Settings & data</h1><div class="grid"><div class="card"><h3>Appearance</h3><button class="ghost" id="light">Light theme</button> <button class="ghost" id="dark">Dark theme</button><h3 style="margin-top:25px">Installed translations</h3>'+Object.entries(versions).map(([k,v])=>'<p><strong>'+k+'</strong> · '+v.name+'<br><small class="muted">'+v.rights+'</small></p>').join('')+DATA.translationSlots.map(v=>'<p><strong>'+v.code+'</strong> · '+v.name+'<br><small class="muted">'+v.status+' — '+v.rights+'</small></p>').join('')+'</div><div class="card"><h3>Personal data backup</h3><p class="muted">Export bookmarks, highlights, notes and reading progress as JSON.</p><button class="btn" id="export">Export data</button> <button class="ghost" id="import">Import backup</button><input id="backup" type="file" accept="application/json" hidden><h3 style="margin-top:25px">Add Bible dataset</h3><p class="muted">Import a translation JSON using the Stillword schema. Session import is not persistent yet.</p><button class="ghost" id="addBible">Import translation</button><input id="bible" type="file" accept=".json,application/json" hidden></div></div>'}
function bindOpen(){document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>{let [b,c]=x.dataset.open.split('.');book=b;chapter=+c;go('read')})}
function bind(){document.querySelectorAll('[data-act]').forEach(x=>x.onclick=()=>{let r=x.dataset.ref,a=x.dataset.act;if(a==='bookmark'){db.bookmarks.includes(r)?db.bookmarks=db.bookmarks.filter(v=>v!==r):db.bookmarks.push(r);save();render()}else if(a==='highlight'){openModal('<h3>Highlight '+label(r)+'</h3><div class="row">'+['gold','green','blue','pink','none'].map(c=>'<button class="ghost" data-color="'+c+'">'+c+'</button>').join('')+'</div>');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{b.dataset.color==='none'?delete db.highlights[r]:db.highlights[r]=b.dataset.color;save();$('#modal').innerHTML='';render()})}else{openModal('<h3>Personal note · '+label(r)+'</h3><textarea id="note">'+esc(db.notes[r]||'')+'</textarea><div class="row" style="justify-content:end;margin-top:12px"><button class="btn" id="saveNote">Save note</button></div>');$('#saveNote').onclick=()=>{let v=$('#note').value.trim();v?db.notes[r]=v:delete db.notes[r];save();$('#modal').innerHTML='';render()}}});document.querySelectorAll('[data-remove]').forEach(x=>x.onclick=()=>{let r=x.dataset.remove,k=x.dataset.kind;if(k==='bookmarks')db.bookmarks=db.bookmarks.filter(v=>v!==r);if(k==='highlights')delete db.highlights[r];if(k==='notes')delete db.notes[r];save();render()});bindOpen()}
function render(){let title={home:'Your reading space',read:'The Bible',search:'Search',bookmarks:'Bookmarks',highlights:'Highlights',notes:'Personal notes',plans:'Reading plans',settings:'Settings'};$('#crumb').textContent=title[page];$('#view').innerHTML=({home,read,search:searchPage,bookmarks:()=>'<div class="eyebrow">Saved passages</div><h1 class="pageTitle">Bookmarks</h1>'+collection('bookmarks'),highlights:()=>'<div class="eyebrow">Marked for reflection</div><h1 class="pageTitle">Highlights</h1>'+collection('highlights'),notes:()=>'<div class="eyebrow">Your reflections</div><h1 class="pageTitle">Personal notes</h1>'+collection('notes'),plans,settings})[page]();if(page==='home'){ $('#openBible').onclick=()=>go('read');$('#daily').onclick=()=>{book='Ps';chapter=23;go('read')};$('#continue').onclick=()=>{book=db.lastBook;chapter=db.lastChapter;tr=db.lastTranslation;go('read')}}if(page==='read'){ $('#book').onchange=e=>{book=e.target.value;chapter=1;render()};$('#chapter').onchange=e=>{chapter=+e.target.value;render()};$('#version').onchange=e=>{tr=e.target.value;render()};$('#smaller').onclick=()=>{font=Math.max(14,font-1);db.font=font;save();render()};$('#bigger').onclick=()=>{font=Math.min(30,font+1);db.font=font;save();render()};$('#prev').onclick=()=>{if(chapter>1)chapter--;render()};$('#next').onclick=()=>{if(chapter<books.find(x=>x.osis===book).chapters)chapter++;render()};bind()}if(page==='search'){$('#searchBtn').onclick=doSearch;$('#q').onkeydown=e=>{if(e.key==='Enter')doSearch()};if(query)doSearch()}if(['bookmarks','highlights','notes'].includes(page))bind();if(page==='plans')document.querySelectorAll('[data-plan]').forEach(x=>x.onclick=()=>{db.plans[x.dataset.plan]=(db.plans[x.dataset.plan]||0)+1;save();book=['Ps','John','Rom'][+x.dataset.plan];chapter=[23,3,8][+x.dataset.plan];go('read')});if(page==='settings'){$('#light').onclick=()=>theme('light');$('#dark').onclick=()=>theme('dark');$('#export').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.href=u;a.download='stillword-backup.json';a.click();URL.revokeObjectURL(u)};$('#import').onclick=()=>$('#backup').click();$('#backup').onchange=async e=>{try{db={...fresh(),...JSON.parse(await e.target.files[0].text())};theme(db.theme);render()}catch{alert('Invalid backup file')}};$('#addBible').onclick=()=>$('#bible').click();$('#bible').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.code||!x.name||!x.chapters)throw Error('Expected code, name and chapters');versions[x.code]={name:x.name,rights:x.rights||'User supplied',chapters:x.chapters};tr=x.code;alert('Loaded for this session only. Add it to data/bible-data.js for permanent bundling.');go('read')}catch(err){alert('Could not load dataset: '+err.message)}}}}
document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>go(x.dataset.page));$('#theme').onclick=()=>theme(db.theme==='dark'?'light':'dark');theme(db.theme);$('#status').textContent=Object.keys(versions).join(' · ')+' sample data';render();
})();
</script></body></html>
